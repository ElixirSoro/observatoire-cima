[project]
name = "obscima"
version = "0.1.0"
description = "Observatoire CIMA : base de données de marché de l'assurance, sur sources publiques"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "reportlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# DÉROGATION règle 10 : ces bibliothèques ne publient pas d'annotations de types.
module = ["pdfplumber", "reportlab.*"]
ignore_missing_imports = true
