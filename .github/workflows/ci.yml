name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  donnees:
    name: Base de données (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest -q
      - run: python -m obscima.construire

  application:
    name: Application web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Préparer le site pour la mise en ligne
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  mise-en-ligne:
    name: Mise en ligne du site
    if: github.event_name == 'push'
    needs: [donnees, application]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
